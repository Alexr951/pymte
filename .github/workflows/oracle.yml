name: R oracle

# Re-runs the R reference implementation and compares it with the Python
# results. This job is informational: it is skipped when R cannot be set up.

on:
  workflow_dispatch:

jobs:
  oracle:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ivmte
            any::lpSolveAPI
            any::splines2
            any::jsonlite
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: Rscript tests/fixtures/run_oracle.R tests/fixtures/live
      - run: pytest -m oracle_live
